name: Build & Publish Wisconsin RSS (MEDIA5 • ASCII)

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare publish directory
        run: |
          mkdir -p public
          if [ -d img ]; then mkdir -p public/img && cp -r img/* public/img/ || true; fi

      - name: Generate Wisconsin Sports RSS feed
        run: |
          python wisco_core_teams_rss_MEDIA5_ASCII.py \
            --out public/wisconsin-sports.xml \
            --days 6 --max-items 240 --live-final-only \
            --fallback-base-url "https://gjngh001-glitch.github.io/risevision-sports" \
            --prefer-event-photos --scrape-og

      - name: Upload feed artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: wisconsin-sports.xml
          path: public/wisconsin-sports.xml

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
